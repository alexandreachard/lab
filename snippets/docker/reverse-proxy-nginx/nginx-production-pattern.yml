services:
  nginx:
    image: ${NGINX_IMAGE:-nginx:stable-alpine3.24}
    container_name: ${NGINX_CONTAINER_NAME:-nginx}

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    ports:
      - "${NGINX_HOST_PORT_HTTP:-80}:80"
      - "${NGINX_HOST_PORT_HTTPS:-443}:443"

    volumes:
      - "${NGINX_CONF_PATH}:/etc/nginx/conf.d:rw"
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - "${NGINX_CERTS_PATH}:/etc/nginx/certs:ro"
      - nginx-logs:/var/log/nginx

    networks:
      - proxy
      - backend

volumes:
  nginx-logs:
    driver: local

networks:
  proxy:
    external: true

  backend:
    external: true
